img { max-width: 100%; height: auto; }
body {

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px 16px;
  padding-block: 24px;
}
.wrap { max-width: 820px; margin: 0 auto; }
h1 {
  font-size: 24px;
  margin: 0 0 4px 0;
  display: flex;
  align-items: center;
  gap: 8px;

.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
.tabs {

  gap: 6px;

.tab-btn {

  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  padding: 10px 4px;
  cursor: pointer;

  margin-right: 18px;

.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }

.card {

th, td { text-align: left; padding: 9px 8px; }
th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); }
tbody tr { border-bottom: 1px solid var(--row-border); }
tbody tr:last-child { border-bottom: none; }
tbody tr.winner-row { background: linear-gradient(90deg, var(--win-bg), transparent); }
.rank-cell { font-weight: 700; width: 34px; }
.rank-1 { color: var(--gold); }
.rank-2 { color: var(--silver); }
.rank-3 { color: var(--bronze); }
.name-cell { font-weight: 600; white-space: nowrap; }
@media (max-width: 480px) {

}
.medal { margin-right: 4px; }
.pill {

  background: var(--pill-bg);

.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.week-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.week-header .tag {

}
.error {

  padding: 14px 16px; font-size: 13px; white-space: pre-wrap;
}
.footer-note { text-align: center; color: var(--footer-text); font-size: 12px; margin-top: 8px; }
.grid-scroll { overflow-x: auto; position: relative; }
.grid-scroll table { min-width: 720px; }
.grid-scroll th:first-child, .grid-scroll td:first-child {
  position: sticky; left: 0; background: var(--card-bg); z-index: 1;
}
.grid-scroll .actual-row td:first-child { background: var(--actual-bg); }
.scroll-hint { display: none; font-size: 12px; color: var(--text-muted); margin: -4px 0 10px 0; }

  .scroll-hint { display: block; }
}
.lock-msg { padding: 6px 0; }
.pick-cell.correct { color: var(--correct); font-weight: 700; }
.pick-cell.wrong { color: var(--wrong); }

  text-align: center;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseSections(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('|'));
  const rows = lines.map(line => {
    let cells = line.split('|').map(c => c.trim());
    if (cells[0] === '') cells = cells.slice(1);
    if (cells[cells.length - 1] === '') cells = cells.slice(0, -1);
    return cells;
  });

  const isBlank = cells => cells.every(c => c === '');
  const isSeparator = cells => !isBlank(cells) && cells.every(c => /^:?-{1,3}:?$/.test(c) || c === '');

  const sections = {};
  let currentName = null;
  let headers = null;
  let dataRows = [];

  const flush = () => {
    if (currentName && headers) {
      sections[currentName] = dataRows.map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = r[i] !== undefined ? r[i] : '');
        return obj;
      });
    }
  };

  for (const cells of rows) {
    if (isBlank(cells)) { flush(); currentName = null; headers = null; dataRows = []; continue; }
    if (isSeparator(cells)) continue;
    const nonEmpty = cells.filter(c => c !== '');
    if (!headers && nonEmpty.length === 1 && cells[0] !== '') {
      flush();
      currentName = cells[0];
      headers = null;
      dataRows = [];
      continue;
    }
    if (currentName && !headers) { headers = cells; continue; }
    if (currentName && headers) { dataRows.push(cells); }
  }
  flush();
  return sections;
}

function medal(rank) {
  if (rank === '1') return '<span class="medal">🥇</span>';
  if (rank === '2') return '<span class="medal">🥈</span>';
  if (rank === '3') return '<span class="medal">🥉</span>';
  return '';
}

function renderStandings(rows) {
  if (!rows || !rows.length) return '<p class="muted">No season standings yet.</p>';
  const sorted = [...rows].sort((a, b) => Number(a['Season Rank']) - Number(b['Season Rank']));
  const body = sorted.map(r => {
    const rankClass = r['Season Rank'] === '1' ? 'rank-1' : r['Season Rank'] === '2' ? 'rank-2' : r['Season Rank'] === '3' ? 'rank-3' : '';
    const weeksWon = Number(r['Weeks Won'] || 0);
    return `<tr>
      <td class="rank-cell ${rankClass}">${medal(r['Season Rank'])}${esc(r['Season Rank'])}</td>
      <td class="name-cell">${esc(r['Name'])}${weeksWon > 0 ? `<span class="pill">${weeksWon} week${weeksWon > 1 ? 's' : ''} won</span>` : ''}</td>
      <td class="num">${esc(r['Total Correct'])}/${esc(r['Total Games Graded'])} <span class="muted" style="font-weight:400;">(${Number(r['Total Games Graded']) > 0 ? Math.round(Number(r['Total Correct']) / Number(r['Total Games Graded']) * 100) : 0}%)</span></td>
      <td class="num">${esc(r['Avg Tiebreaker Diff'])}</td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr><th>Rank</th><th>Name</th><th class="num">Correct</th><th class="num">Avg TB Diff</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function renderWeekly(rows) {
  if (!rows || !rows.length) return { html: '<p class="muted">No weeks graded yet.</p>', week: null };
  const latestWeek = Math.max(...rows.map(r => Number(r['Week'])));
  const weekRows = rows.filter(r => Number(r['Week']) === latestWeek)
    .sort((a, b) => Number(a['Rank']) - Number(b['Rank']));
  const body = weekRows.map(r => {
    const won = (r['Won'] || '').toUpperCase() === 'Y';
    return `<tr class="${won ? 'winner-row' : ''}">
      <td class="rank-cell">${medal(r['Rank'])}${esc(r['Rank'])}</td>
      <td class="name-cell">${esc(r['Name'])}${won ? '<span class="pill">👑 Winner</span>' : ''}</td>
      <td class="num">${esc(r['Correct'])}/${esc(r['Total Games'])}</td>
      <td class="num">${esc(r['Tiebreaker Guess'])}</td>
      <td class="num">${esc(r['Diff'])}</td>
    </tr>`;
  }).join('');
  return {
    week: latestWeek,
    html: `<table>

}

function findLatestPicksSection(sections) {
  let best = null, bestWeek = -1;
  for (const key of Object.keys(sections)) {
    const m = key.match(/^Week (\d+) Picks$/i);
    if (m) {
      const w = Number(m[1]);
      if (w > bestWeek) { bestWeek = w; best = key; }
    }
  }
  return best ? { week: bestWeek, rows: sections[best] } : null;
}

function renderPicksGrid(picksInfo) {

}

// ---------- Live "Week N Picks" — reads straight from the Form's response sheet ----------
// Published-to-web CSV of the Form's linked response sheet. This is live: whenever
// someone submits the form, this URL reflects it within moments. No republish needed.
// If a new Google Form is ever created for a future week, update this URL to match
// (Form editor -> Responses -> View in Sheets -> File -> Share -> Publish to web ->
// select the "Form Responses" sheet -> format "Comma-separated values (.csv)" -> Publish).
const PICKS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_jjqK4CQCw5LQrmBHJouRT9ybvQppaCz4Cu3i8lWW3H4zRuzr-AOlGcRnfsV0Y7ecxXAY57i-4lQs/pub?gid=293509158&single=true&output=csv";

// ---------- Column mapping — matches CSV/report columns to GAMES by team names ----------
// IMPORTANT: a Google Form's question (and therefore response-sheet column) order is
// NOT guaranteed to match the order games are listed in the GAMES array above — e.g.
// when a form is duplicated from a differently-ordered template. Never assume column
// index "2 + gameIndex" lines up with GAMES[gameIndex]; always resolve the column for
// each game by matching the header text against that game's away/home team names.
function buildGameColumnMap(headerRow) {
  const byGame = GAMES.map(g => headerRow.findIndex(h => h && h.includes(g.away) && h.includes(g.home)));
  const used = new Set(byGame.filter(i => i >= 0));
  let tbCol = -1;
  for (let c = 2; c < headerRow.length; c++) {
    if (!used.has(c)) { tbCol = c; break; }
  }
  return { byGame, tbCol };
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

// ---------- Timestamp helpers — used to tell "this week's" submissions apart from ----------
// leftover rows from a previous week. The same Google Form/response sheet is reused
// every week (its question text/options get edited in place, not recreated), so the
// sheet's history includes every prior week's rows too. A person who doesn't resubmit
// for the current week will still have an old row sitting there under the current
// week's column headers — these helpers make sure that old row is never mistaken for
// a current-week submission.
function parseSheetTimestamp(raw) {
  if (!raw) return null;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

// A row counts as "this week's" only if its timestamp is on/after this week's picks
// opening (SNAPSHOT_TAKEN_AT is set to that moment every time the weekly rollover runs).
function isThisWeeksRow(row) {
  const ts = parseSheetTimestamp(row[0]);
  if (!ts) return false;
  return ts.getTime() >= new Date(SNAPSHOT_TAKEN_AT).getTime();
}

function formatPickedAt(raw) {
  const d = parseSheetTimestamp(raw);
  if (!d) return '—';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function renderLivePicksTable(rows) {
  if (!rows || rows.length < 2) {
    return '<p class="muted">No one has picked Week ' + CURRENT_WEEK + ' yet.</p>';
  }
  const header = rows[0];
  const { byGame, tbCol } = buildGameColumnMap(header);
  const dataRows = rows.slice(1);
  // Keep only the most recent submission per name (rows are in submission order,
  // so the last row for a given name wins), then drop anyone whose latest row is
  // actually a leftover from a previous week (see note above) — this view should
  // only ever show people who have picked THIS week, not everyone who ever has.
  const byName = new Map();
  dataRows.forEach(r => {
    const name = (r[1] || '').trim();
    if (name) byName.set(name, r);
  });

  const finalRows = Array.from(byName.values()).filter(isThisWeeksRow);
  if (!finalRows.length) {
    return '<p class="muted">No one has picked Week ' + CURRENT_WEEK + ' yet.</p>';
  }

  const headerCells = GAMES.map(g => `<th>${esc(g.matchup)}</th>`).join('');
  const bodyRows = finalRows.map(r => {
    const cells = GAMES.map((g, i) => `<td class="pick-cell">${esc(byGame[i] >= 0 ? (r[byGame[i]] || '') : '')}</td>`).join('');
    const tb = tbCol >= 0 ? (r[tbCol] || '') : '';
    return `<tr><td class="name-cell">${esc(r[1])}</td>${cells}<td class="num">${esc(tb)}</td></tr>`;
  }).join('');

  return `
  <div class="scroll-hint">← swipe to see all games →</div>
  <div class="grid-scroll">
    <table>
      <thead><tr><th>Name</th>${headerCells}<th>TB Guess</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  </div>`;
}

// ---------- Live standings — grades finished games straight from ESPN's public scoreboard ----------
// No API key needed; this is the same feed ESPN's own site uses. Only counts games that
// have actually finished (status "post") — in-progress games don't flip anyone's count.
const SEASON_YEAR = 2026;
function espnScoreboardUrl() {
  return `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${CURRENT_WEEK}&seasontype=2&dates=${SEASON_YEAR}`;
}

async function loadLiveGrades() {
  renderLiveStandingsShell();
  const contentEl = document.getElementById('live-standings-content');
  const tagEl = document.getElementById('live-standings-tag');
  try {
    const [scoreRes, picksRes] = await Promise.all([
      fetch(espnScoreboardUrl() + '&_=' + Date.now(), { cache: 'no-store' }),
      fetch(PICKS_CSV_URL + '&nocache=' + Date.now(), { cache: 'no-store' })
    ]);
    if (!scoreRes.ok) throw new Error('ESPN HTTP ' + scoreRes.status);
    if (!picksRes.ok) throw new Error('Picks HTTP ' + picksRes.status);
    const scoreData = await scoreRes.json();
    const picksText = await picksRes.text();

    const events = scoreData.events || [];
    const results = GAMES.map(g => {
      const ev = events.find(e => {
        const comps = (e.competitions && e.competitions[0] && e.competitions[0].competitors) || [];
        const names = comps.map(c => c.team && c.team.displayName);
        return names.includes(g.away) && names.includes(g.home);
      });
      if (!ev) return { ...g, decided: false, winner: null, actualTotal: null };
      const comp = ev.competitions[0];
      const state = comp.status && comp.status.type && comp.status.type.state; // 'pre' | 'in' | 'post'
      const comps = comp.competitors || [];
      const scores = {};
      comps.forEach(c => { scores[c.team.displayName] = Number(c.score); });
      const decided = state === 'post';
      let winner = null;
      if (decided) {
        winner = scores[g.home] > scores[g.away] ? g.home : (scores[g.away] > scores[g.home] ? g.away : 'TIE');
      }
      const actualTotal = (scores[g.home] != null && scores[g.away] != null) ? (scores[g.home] + scores[g.away]) : null;
      return { ...g, decided, winner, actualTotal, state };
    });

    const decidedCount = results.filter(r => r.decided).length;
    const tiebreakerResult = results.find(r => r.tiebreaker);

    const rows = parseCSV(picksText);
    const header = rows[0] || [];
    const { byGame, tbCol } = buildGameColumnMap(header);
    const dataRows = rows.slice(1);
    const byName = new Map();
    dataRows.forEach(r => { const name = (r[1] || '').trim(); if (name) byName.set(name, r); });

    // Only people who've actually picked THIS week belong in the live standings — a
    // stale leftover row from a previous week (see the timestamp-helpers note above)
    // would otherwise get silently graded as 0-for-the-week against this week's
    // mismatched matchups, which is wrong. Filtering here means "everyone" never
    // shows up — only the people who have actually picked show up, each marked with
    // when they picked.
    const standings = Array.from(byName.values())
      .filter(isThisWeeksRow)
      .map(r => {
        let correct = 0;
        GAMES.forEach((g, i) => {
          const res = results[i];
          const col = byGame[i];
          if (res.decided && res.winner !== 'TIE' && col >= 0 && r[col] === res.winner) correct++;
        });
        const tbGuess = tbCol >= 0 ? Number(r[tbCol]) : NaN;
        const diff = (tiebreakerResult && tiebreakerResult.decided && tiebreakerResult.actualTotal != null && !isNaN(tbGuess))
          ? Math.abs(tbGuess - tiebreakerResult.actualTotal) : null;
        return { name: (r[1] || '').trim(), correct, diff, submittedAt: r[0] || '' };
      });

    // Ranking still uses Correct first, then the tiebreaker diff once it's known
    // (that's the real tiebreak rule) — only the DISPLAYED column changes below,
    // since showing "TB Diff" before the tiebreaker game is final is meaningless.
    standings.sort((a, b) => {
      if (b.correct !== a.correct) return b.correct - a.correct;
      if (a.diff == null && b.diff == null) return 0;
      if (a.diff == null) return 1;
      if (b.diff == null) return -1;
      return a.diff - b.diff;
    });

    if (!standings.length) {
      contentEl.innerHTML = '<p class="muted">No one has picked Week ' + CURRENT_WEEK + ' yet.</p>';
    } else {
      const leaderCorrect = standings[0].correct; const body = standings.map((s, idx) => `
        <tr>
          <td class="rank-cell">${idx + 1}</td>
          <td class="name-cell">${esc(s.name)}</td>
          <td class="num">${s.correct}/${decidedCount}</td><td class="num">${(leaderCorrect - s.correct) === 0 ? '—' : (leaderCorrect - s.correct)}</td>
          <td>${esc(formatPickedAt(s.submittedAt))}</td>
        </tr>`).join('');
      contentEl.innerHTML = `<table>
        <thead><tr><th>Rank</th><th>Name</th><th class="num">Correct</th><th class="num">Behind</th><th>Picked</th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    }
    tagEl.textContent = standings.length + (standings.length === 1 ? ' person picked' : ' people picked') + ' · ' + decidedCount + '/' + GAMES.length + ' games final';
  } catch (err) {
    tagEl.textContent = 'Unavailable';
    contentEl.innerHTML = `<p class="muted">Couldn't load live standings right now. Try reloading the page.</p>`;
  }
}

function submitPicks() {
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('submitMsg');

  if (isPicksLocked()) {
    msg.className = 'submit-msg err';
    msg.textContent = `Picks for Week ${CURRENT_WEEK} just locked — the first game has kicked off.`;
    btn.disabled = true;
    btn.textContent = 'Locked';
    return;
  }

  const name = document.getElementById('yourName').value.trim();

  if (!name) { msg.className = 'submit-msg err'; msg.textContent = 'Please enter your name.'; return; }

  const picks = [];
  for (let i = 0; i < GAMES.length; i++) {
    const checked = document.querySelector(`input[name="game${i}"]:checked`);
    if (!checked) {
      msg.className = 'submit-msg err';
      msg.textContent = `Please make a pick for: ${GAMES[i].matchup}`;
      return;
    }
    picks.push(checked.value);
  }
  const tbGuessEl = document.getElementById('tbGuess');
  const tbGuess = tbGuessEl ? tbGuessEl.value.trim() : '';
  if (!tbGuess || isNaN(Number(tbGuess))) {
    msg.className = 'submit-msg err';
    msg.textContent = 'Please enter a numeric tiebreaker guess.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const iframeName = 'pickem_submit_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.action = FORM_ACTION_URL;
    form.method = 'POST';
    form.target = iframeName;
    form.style.display = 'none';

    const addField = (fieldName, value) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = fieldName;
      input.value = value;
      form.appendChild(input);
    };

    addField(NAME_ENTRY, name);
    GAMES.forEach((g, i) => addField(g.entry, picks[i]));
    addField(TIEBREAKER_ENTRY, tbGuess);

    document.body.appendChild(form);
    form.submit();

    setTimeout(() => {
      msg.className = 'submit-msg ok';
      msg.textContent = `Thanks ${name}! Your picks for Week ${CURRENT_WEEK} are in.`;
      btn.textContent = 'Submitted ✓';
      document.body.removeChild(form);
      document.body.removeChild(iframe);
    }, 900);
  } catch (err) {
    msg.className = 'submit-msg err';
    msg.textContent = `Something went wrong submitting: ${err.message || err}`;
    btn.disabled = false;
    btn.textContent = 'Submit My Picks';
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

renderLeaderboard();
renderPicksTab();
loadLivePicks();
loadLiveGrades();
</script>
</body>
</html>
